services:
  db:
    image: postgres:17-alpine
    container_name: union-db
    restart: unless-stopped
    # 호스트 포트 노출 안 함: app이 내부망(db:5432)으로 붙음.
    # (개발용 DB는 별도 컨테이너 unionsystems-db:5433 사용 → 포트 충돌 방지)
    environment:
      POSTGRES_DB: union_integrated
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d   # V1 스키마 자동 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: union-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/union_integrated
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8081
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      NAVER_APIGW_KEY_ID: ${NAVER_APIGW_KEY_ID:-}
      NAVER_APIGW_KEY: ${NAVER_APIGW_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
