spring:
  application:
    name: union-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/union_integrated?charSet=UTF-8}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:dev-only-do-not-use-in-production-87e4f7f192098900483d30d5a1297047}
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

naver:
  api:
    key-id: ${NAVER_APIGW_KEY_ID:}
    key: ${NAVER_APIGW_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
