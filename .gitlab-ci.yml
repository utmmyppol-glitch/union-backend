# =============================================
# Union Backend - GitLab CI/CD Pipeline
# =============================================

stages:
  - build
  - test
  - docker
  - deploy
  - notify

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# --- Gradle 캐시 ---
.gradle-cache: &gradle-cache
  cache:
    key: gradle-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/
      - build/
      - "*/build/"

# ---- Build ----
build:
  stage: build
  image: eclipse-temurin:17-jdk
  <<: *gradle-cache
  script:
    - chmod +x gradlew
    - ./gradlew :module-admin:bootJar --no-daemon
  artifacts:
    paths:
      - module-admin/build/libs/*.jar
    expire_in: 1 hour

# ---- Test ----
test:
  stage: test
  image: eclipse-temurin:17-jdk
  <<: *gradle-cache
  script:
    - chmod +x gradlew
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit: "*/build/test-results/test/*.xml"

# ---- Docker Image ----
docker:
  stage: docker
  image: docker:latest
  needs: ["build", "test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - docker build -t $DOCKER_IMAGE .

# ---- Deploy  ----
deploy:
  stage: deploy
  image: docker:latest
  needs: ["docker"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - chmod +x deploy/deploy.sh
    - DOCKER_IMAGE=$DOCKER_IMAGE ./deploy/deploy.sh

# ---- Notify (Teams) ----
notify:success:
  stage: notify
  image: alpine:latest
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $TEAMS_WEBHOOK_URL'
      when: on_success
  before_script: [apk add --no-cache curl]
  script:
    - |
      curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d @- <<JSON
      {
        "type": "message",
        "attachments": [
          {
            "contentType": "application/vnd.microsoft.card.adaptive",
            "content": {
              "type": "AdaptiveCard",
              "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "version": "1.4",
              "body": [
                { "type": "TextBlock", "size": "Large", "weight": "Bolder", "color": "Good", "text": "🚀 배포 완료: $CI_PROJECT_NAME" },
                { "type": "FactSet", "facts": [
                  { "title": "프로젝트", "value": "$CI_PROJECT_PATH" },
                  { "title": "작업자", "value": "$GITLAB_USER_NAME" },
                  { "title": "커밋", "value": "[$CI_COMMIT_SHORT_SHA]($CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA)" }
                ]}
              ]
            }
          }
        ]
      }
      JSON

notify:failure:
  stage: notify
  image: alpine:latest
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $TEAMS_WEBHOOK_URL'
      when: on_failure
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d @- <<JSON
      {
        "type": "message",
        "attachments": [
          {
            "contentType": "application/vnd.microsoft.card.adaptive",
            "content": {
              "type": "AdaptiveCard",
              "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "version": "1.4",
              "body": [
                { "type": "TextBlock", "size": "Large", "weight": "Bolder", "color": "Attention", "text": "❌ 배포 실패 (Failed)" },
                { "type": "FactSet", "facts": [
                  { "title": "프로젝트", "value": "$CI_PROJECT_PATH" },
                  { "title": "브랜치", "value": "$CI_COMMIT_BRANCH" },
                  { "title": "작업자", "value": "$GITLAB_USER_NAME" },
                  { "title": "커밋", "value": "[$CI_COMMIT_SHORT_SHA]($CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA)" }
                ]},
                { "type": "TextBlock", "wrap": true, "text": "배포 중 에러가 발생했습니다. 파이프라인 로그를 확인하세요." }
              ],
              "actions": [
                { "type": "Action.OpenUrl", "title": "🔗 파이프라인 로그", "url": "$CI_PIPELINE_URL" },
                { "type": "Action.OpenUrl", "title": "커밋 보기", "url": "$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA" }
              ]
            }
          }
        ]
      }
      JSON
